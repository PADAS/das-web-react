name: Build das-web-react on Pull Request
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'deploy')
    uses: PADAS/serca-pipelines/.github/workflows/pipeline-kubernetes-node-pr.yml@main
    secrets: inherit
    with:
      app-name: das-web-react
      node-version: "22"
      lint-command: "yarn lint"
      test-command: "yarn test-ci"
      build-enabled: false
      repository: europe-west3-docker.pkg.dev/padas-app/er-mt/das-web-react
      secondary-repository: europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react
      dockerfile: Dockerfile.mt
      build-args: ENV_FILE=.env.development
      deploy-pr-env: false

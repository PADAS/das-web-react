name: Legacy Deploy (kubectl)

# NOTE: das-web-react is a public repository; it cannot call reusable workflows
# from the private PADAS/serca-pipelines repo. This workflow is kept in-repo
# and kept in sync manually with serca-pipelines/_deploy_legacy_kubectl.yml.

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name for job protection rules'
        required: true
        type: string
      image_repository:
        description: 'Full Docker image repository path (without tag)'
        required: true
        type: string
      deployment_name:
        description: 'Kubernetes Deployment name to update'
        required: true
        type: string
      container_name:
        description: 'Container name within the Deployment to update'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      project_id:
        description: 'GCP project ID of the target cluster'
        required: true
        type: string
      cluster_name:
        description: 'GKE cluster name'
        required: true
        type: string
      cluster_zone:
        description: 'GKE cluster zone'
        required: true
        type: string
      bastion_host:
        description: 'Bastion host IP address (used for ssh-keyscan)'
        required: true
        type: string
      bastion_instance:
        description: 'GCE instance name of the bastion'
        required: true
        type: string
      bastion_zone:
        description: 'Zone where the bastion GCE instance lives'
        required: true
        type: string
      bastion_project:
        description: 'GCP project ID of the bastion instance (defaults to project_id)'
        required: false
        type: string
        default: ''
      tenants:
        description: 'Comma-separated list of tenant namespaces'
        required: true
        type: string
      service_account:
        description: 'Service account to impersonate (defaults to vars.SERVICE_ACCOUNT)'
        required: false
        type: string
        default: ''

jobs:
  kubectl-apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      - name: GCP Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.service_account || vars.SERVICE_ACCOUNT }}

      - name: Setup gcloud and kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'kubectl'

      - name: Get cluster credentials
        run: |
          SUCCESS=false
          for i in {1..5}; do
            if gcloud container clusters get-credentials "${{ inputs.cluster_name }}" \
              --zone="${{ inputs.cluster_zone }}" \
              --project="${{ inputs.project_id }}"; then
              SUCCESS=true
              break
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$SUCCESS" = "false" ]; then
            echo "❌ Failed to get cluster credentials after 5 attempts"
            exit 1
          fi

      - name: Setup SSH tunnel
        timeout-minutes: 5
        run: |
          BASTION_PROJECT="${{ inputs.bastion_project || inputs.project_id }}"
          echo "Setting up tunnel for ${{ inputs.environment }} environment"
          echo "Bastion: ${{ inputs.bastion_instance }} ($BASTION_PROJECT / ${{ inputs.bastion_zone }})"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ inputs.bastion_host }}" >> ~/.ssh/known_hosts

          for i in {1..3}; do
            echo "Tunnel attempt $i..."
            gcloud compute ssh "${{ inputs.bastion_instance }}" \
              --project="$BASTION_PROJECT" \
              --zone="${{ inputs.bastion_zone }}" \
              --ssh-flag="-4 -L8888:localhost:8888 -N -f" && break || echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          sleep 10
          if ! ss -ltn | grep -q ':8888'; then
            echo "❌ SSH tunnel setup failed"
            exit 1
          fi
          echo "✅ Tunnel established successfully"

      - name: Configure kubectl
        timeout-minutes: 5
        env:
          HTTPS_PROXY: localhost:8888
          # Wildcard (*.googleapis.com) is not honoured by Go's HTTP client (used by kubectl).
          # Enumerate specific GCP domains to prevent auth requests being proxied through the tunnel.
          NO_PROXY: accounts.google.com,oauth2.googleapis.com,storage.googleapis.com,container.googleapis.com,iam.googleapis.com
        run: |
          echo "Testing kubectl connection..."
          kubectl get nodes

      - name: Deploy to all tenants
        env:
          HTTPS_PROXY: localhost:8888
          NO_PROXY: accounts.google.com,oauth2.googleapis.com,storage.googleapis.com,container.googleapis.com,iam.googleapis.com
        run: |
          if [ -z "${{ inputs.tenants }}" ]; then
            echo "❌ tenants input is empty — set the LEGACY_TENANTS_* repo variable before running"
            exit 1
          fi

          IMAGE="${{ inputs.image_repository }}:${{ inputs.image_tag }}"
          IFS=',' read -ra RAW_TENANTS <<< "${{ inputs.tenants }}"

          # Trim surrounding whitespace from each tenant name
          TENANTS=()
          for t in "${RAW_TENANTS[@]}"; do
            t="${t#"${t%%[![:space:]]*}"}"
            t="${t%"${t##*[![:space:]]}"}"
            TENANTS+=("$t")
          done

          TENANT_COUNT=${#TENANTS[@]}
          SUCCESS_COUNT=0
          FAILED_TENANTS=()

          echo "🚀 Starting deployment to ${{ inputs.environment }} environment"
          echo "📊 Total tenants: $TENANT_COUNT"
          echo "🐳 Image: $IMAGE"
          echo ""

          for i in "${!TENANTS[@]}"; do
            TENANT="${TENANTS[$i]}"
            echo "🏢 [$((i+1))/$TENANT_COUNT] Deploying to tenant: $TENANT"

            if kubectl set image "deployment/${{ inputs.deployment_name }}" \
                "${{ inputs.container_name }}=$IMAGE" \
                -n "$TENANT"; then
              echo "  ↳ Waiting for rollout to complete..."
              if kubectl rollout status "deployment/${{ inputs.deployment_name }}" \
                  -n "$TENANT" --timeout=300s; then
                echo "  ✅ SUCCESS for $TENANT"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "  ❌ ROLLOUT FAILED for $TENANT"
                FAILED_TENANTS+=("$TENANT")
              fi
            else
              echo "  ❌ SET IMAGE FAILED for $TENANT"
              FAILED_TENANTS+=("$TENANT")
            fi
          done

          echo ""
          echo "🏁 DEPLOYMENT SUMMARY"
          echo "  ✅ Successful: $SUCCESS_COUNT / $TENANT_COUNT"
          echo "  ❌ Failed:     ${#FAILED_TENANTS[@]}"

          if [ ${#FAILED_TENANTS[@]} -gt 0 ]; then
            echo "💥 Failed tenants: ${FAILED_TENANTS[*]}"
            exit 1
          fi
          echo "🎉 All deployments successful!"

      - name: Cleanup tunnel
        if: always()
        run: |
          echo "Cleaning up SSH tunnel..."
          pkill -f "L8888:localhost:8888" || true

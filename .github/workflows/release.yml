name: Release Deploy das-web-react
on:
  push:
    branches:
      - 'release-**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run tests
        run: yarn test-ci

  config:
    runs-on: ubuntu-latest
    outputs:
      build-args: ${{ steps.env-vars.outputs.build-args }}
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - run: |
          npm pkg set "buildbranch"="${{ github.ref_name }}"
          npm pkg set "buildnum"="${{ github.run_number }}"

      - name: Select env file for build
        id: env-vars
        run: echo "build-args=ENV_FILE=.env.production" >> $GITHUB_OUTPUT

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_SAFE=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "value=${BRANCH_SAFE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-config
          path: package.json

  build:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: npm-config
          path: .

      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=europe-west3-docker.pkg.dev/serca-artifact-registry/virtual-docker/moby/buildkit:buildx-stable-1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react
          tags: |
            type=raw,value=${{ needs.config.outputs.image-tag }}

      # Artifact Registry has tag immutability enabled: re-pushing an existing
      # {branch}-{sha} tag fails. The tag is keyed on the commit SHA, so an
      # existing image is the same source; skip the rebuild and let the deploy
      # jobs reuse it.
      - name: Check if image already exists
        id: image-check
        run: |
          IMAGE="europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react:${{ needs.config.outputs.image-tag }}"
          if gcloud artifacts docker images describe "${IMAGE}" --quiet; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist yet; proceeding with build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read node version
        id: node-ver
        run: echo "value=$(cat .node-version)" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: Dockerfile.mt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ needs.config.outputs.build-args }}
            NODE_VERSION=${{ steps.node-ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Feeds nginx's /assets/ fallback; re-uploading restarts the 30-day lifecycle.
  # web-assets only allows release-* branches, so other dispatches stop here.
  publish-assets:
    needs: [config, build]
    runs-on: ubuntu-latest
    environment: web-assets
    steps:
      - name: GCP Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

      - name: Upload the assets of this and the live releases
        env:
          BUCKET: gs://er-web-assets
          IMAGE: europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react
          RECENT_RELEASES: "5"
          TAG: ${{ needs.config.outputs.image-tag }}
        run: |
          set -euo pipefail

          git clone --depth=1 git@github.com:PADAS/serca-argocd-apps.git
          echo "$TAG" > tags.txt
          for env in er-stage er-prod er-prod-me er-prod-us; do
            values_file="serca-argocd-apps/earthranger/das-web-react/values-${env}.yaml"
            if [ -f "$values_file" ]; then
              yq -r '.image.tag' "$values_file" >> tags.txt
            else
              echo "::warning::${values_file} not found, its live release is not refreshed"
            fi
          done

          # Legacy tenants lag MT, so keep every tag of recent versions.
          gcloud artifacts docker tags list "$IMAGE" --filter='tag~/release-' --format='value(tag)' \
            | sed 's#.*/##' > release-tags.txt
          sed -E 's/-[0-9a-f]{7}$//' release-tags.txt | sort -Vu | tail -n "$RECENT_RELEASES" \
            | while read -r version; do grep -E "^${version}-[0-9a-f]{7}$" release-tags.txt; done >> tags.txt

          mapfile -t tags < <(grep -E '^release-' tags.txt | sort -u)
          for tag in "${tags[@]}"; do
            echo "::group::${tag}"
            container_id=$(docker create "${IMAGE}:${tag}")
            if docker cp "${container_id}:/usr/share/nginx/html/assets" "assets-${tag}"; then
              # cp, not rsync: overwriting is what restarts the 30-day lifecycle.
              gcloud storage cp -r "assets-${tag}"/* "${BUCKET}/assets/" < /dev/null
            elif [ "$tag" = "$TAG" ]; then
              echo "::error::${tag} has no /usr/share/nginx/html/assets"
              exit 1
            else
              echo "::warning::${tag} has no /usr/share/nginx/html/assets, skipped"
            fi
            docker rm "$container_id" >/dev/null
            echo "::endgroup::"
          done

  deploy-stage:
    needs: [config, build, test, publish-assets]
    uses: ./.github/workflows/_update-argo.yml
    with:
      app-name: das-web-react
      app-subdir: earthranger
      environment: er-stage
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  sync-stage:
    needs: [config, deploy-stage]
    uses: ./.github/workflows/_sync-argo.yml
    with:
      app-name: das-web-react-er-stage
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  approve-prod-me:
    needs: [sync-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production-me
    steps:
      - run: echo "Production ME deployment approved"

  approve-prod-us:
    needs: [sync-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production-us
    steps:
      - run: echo "Production US deployment approved"

  deploy-prod-me:
    needs: [config, build, approve-prod-me]
    uses: ./.github/workflows/_update-argo.yml
    with:
      app-name: das-web-react
      app-subdir: earthranger
      environment: er-prod-me
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  sync-prod-me:
    needs: [config, deploy-prod-me]
    uses: ./.github/workflows/_sync-argo.yml
    with:
      app-name: das-web-react-er-prod-me
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  deploy-prod-us:
    needs: [config, build, approve-prod-us]
    uses: ./.github/workflows/_update-argo.yml
    with:
      app-name: das-web-react
      app-subdir: earthranger
      environment: er-prod-us
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  sync-prod-us:
    needs: [config, deploy-prod-us]
    uses: ./.github/workflows/_sync-argo.yml
    with:
      app-name: das-web-react-er-prod-us
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  approve-prod:
    needs: [sync-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production
    steps:
      - run: echo "Production EU deployment approved"

  deploy-prod:
    needs: [config, build, approve-prod]
    uses: ./.github/workflows/_update-argo.yml
    with:
      app-name: das-web-react
      app-subdir: earthranger
      environment: er-prod
      image-tag: ${{ needs.config.outputs.image-tag }}
    secrets:
      ARGOCD_APPS_SSH_KEY: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

  sync-prod:
    needs: [config, deploy-prod]
    uses: ./.github/workflows/_sync-argo.yml
    with:
      app-name: das-web-react-er-prod
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  # Legacy kubectl deployments, chained the way das chains them.
  # Constant infra (project_id, bastion_host/instance/zone) is defaulted in the
  # reusable workflow. Deployment set lives in the LEGACY_DEPLOYMENTS repo var.
  #
  # The reusable workflows are local copies, not the serca-pipelines ones: this
  # repo is public and cannot call an internal one (see _slack-notify-failure.yml).
  #
  # deploy-legacy-stage is a canary on the `stage` site that runs beside the MT
  # pipeline and gates the dev batch, so it has no environment: an approval
  # would put the wave back behind a human. `develop` and `stage` are kept out
  # of LEGACY_TENANTS_DEV, since each has a job of its own and would roll twice.
  deploy-legacy-stage:
    name: "deploy-legacy-stage (das-dev / stage site)"
    needs: [config, build, test, publish-assets]
    uses: ./.github/workflows/_deploy_legacy_kubectl.yml
    with:
      environment: ""
      image_repository: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react"
      image_tag: ${{ needs.config.outputs.image-tag }}
      deployments: ${{ vars.LEGACY_DEPLOYMENTS }}
      cluster_name: "das-dev"
      cluster_zone: "us-west1-a"
      tenants: "stage"
      service_account: ${{ vars.LEGACY_DEPLOY_SERVICE_ACCOUNT }}

  deploy-legacy-dev-batch:
    name: "deploy-legacy-dev-batch (das-dev / LEGACY_TENANTS_DEV)"
    needs: [config, sync-stage, deploy-legacy-stage]
    uses: ./.github/workflows/_deploy_legacy_kubectl.yml
    with:
      environment: "legacy-dev"
      image_repository: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react"
      image_tag: ${{ needs.config.outputs.image-tag }}
      deployments: ${{ vars.LEGACY_DEPLOYMENTS }}
      cluster_name: "das-dev"
      cluster_zone: "us-west1-a"
      tenants: ${{ vars.LEGACY_TENANTS_DEV }}
      service_account: ${{ vars.LEGACY_DEPLOY_SERVICE_ACCOUNT }}

  # Split the single LEGACY_TENANTS_PROD list into parallel chunks.
  legacy-prod-split:
    needs: [config, deploy-legacy-dev-batch]
    uses: ./.github/workflows/_split-list.yml
    with:
      list: ${{ vars.LEGACY_TENANTS_PROD }}
      groups: 3

  # No `name:` here on purpose: GitHub appends the matrix value to the job name
  # only when the name is implicit, so a red chunk says which one it was.
  deploy-legacy-prod-batch:
    needs: [config, legacy-prod-split]
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.legacy-prod-split.outputs.chunks) }}
    uses: ./.github/workflows/_deploy_legacy_kubectl.yml
    with:
      environment: "legacy-prod"
      image_repository: "europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react"
      image_tag: ${{ needs.config.outputs.image-tag }}
      deployments: ${{ vars.LEGACY_DEPLOYMENTS }}
      cluster_name: "das-prod1"
      cluster_zone: "europe-west3-a"
      tenants: ${{ matrix.chunk }}
      service_account: ${{ vars.LEGACY_DEPLOY_SERVICE_ACCOUNT }}

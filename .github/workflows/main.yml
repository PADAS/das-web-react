name: Build das-web-react
on:
  push:
    branches:
      - develop
      - 'release-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      build-args: ${{ steps.env-vars.outputs.build-args }}
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm pkg set "buildbranch"="${{ github.head_ref || github.ref_name }}"
          npm pkg set "buildnum"="${{ github.run_number }}"

      - name: Select env file for build
        id: env-vars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "build-args=ENV_FILE=.env.development" >> $GITHUB_OUTPUT
          else
            echo "build-args=ENV_FILE=.env.production" >> $GITHUB_OUTPUT
          fi

      - name: Image tag
        id: tag
        run: echo "value=${{ github.ref_name }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-config
          path: package.json

  build:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: npm-config
          path: .

      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Login to serca-artifact-registry
        uses: docker/login-action@v3
        with:
          registry: europe-west3-docker.pkg.dev/serca-artifact-registry
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Login to padas-app
        uses: docker/login-action@v3
        with:
          registry: europe-west3-docker.pkg.dev/padas-app
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react
            europe-west3-docker.pkg.dev/padas-app/er-mt/das-web-react
          tags: |
            type=raw,value=${{ needs.config.outputs.image-tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile.mt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ needs.config.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-image:
    needs: [config, build]
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARGOCD_APPS_SSH_KEY }}

      - name: Update image tag in serca-argocd-apps
        env:
          TAG: ${{ needs.config.outputs.image-tag }}
        run: |
          git clone --depth 1 git@github.com:PADAS/serca-argocd-apps.git
          cd serca-argocd-apps

          pip install yq
          yq -Yi ".image.tag = \"${TAG}\"" earthranger/das-web-react/values-er-dev.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earthranger/das-web-react/values-er-dev.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "das-web-react: update er-dev image to ${TAG}"
          git push

  sync:
    needs: [config, update-image]
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      APP_NAME: das-web-react-er-dev
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/

      - name: Wait for app
        run: |
          for i in $(seq 1 18); do
            argocd app get "$APP_NAME" --grpc-web &>/dev/null && exit 0
            echo "[$i/18] Not found, retrying in 10s..."
            sleep 10
          done
          echo "::error::App $APP_NAME not found after 180s" && exit 1

      - name: Sync
        run: |
          MAX_RETRIES=3
          RETRY_WAIT=2
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Sync attempt $attempt/$MAX_RETRIES..."
            if argocd app sync "$APP_NAME" --grpc-web --prune; then
              echo "Sync triggered successfully"
              exit 0
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "Sync failed — terminating in-progress operations..."
              argocd app terminate-op "$APP_NAME" --grpc-web 2>/dev/null || true
              sleep 2
              argocd app get "$APP_NAME" --grpc-web --refresh > /dev/null 2>&1 || true
              echo "Retrying in ${RETRY_WAIT}s... [Attempt $((attempt + 1))/$MAX_RETRIES]"
              sleep "$RETRY_WAIT"
              RETRY_WAIT=$((RETRY_WAIT * 2))
            else
              echo "::error::Sync failed after $MAX_RETRIES attempts"
              exit 1
            fi
          done

      - name: Wait for health
        run: argocd app wait "$APP_NAME" --grpc-web --health --sync --timeout 300

name: Build das-web-react
on:
  push:
    branches:
      - develop
      - 'release-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      build-args: ${{ steps.env-vars.outputs.build-args }}
    steps:
      - uses: actions/checkout@v4
      - name: Select env file for build
        id: env-vars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "build-args=ENV_FILE=.env.development" >> $GITHUB_OUTPUT
          else
            echo "build-args=ENV_FILE=.env.production" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    needs: config
    uses: PADAS/serca-pipelines/.github/workflows/pipeline-kubernetes-node-main.yml@main
    secrets: inherit
    with:
      app-name: das-web-react
      node-version: "22"
      lint-command: "yarn lint"
      test-command: "yarn test-ci"
      build-enabled: false  # Build happens in Docker
      repository: europe-west3-docker.pkg.dev/padas-app/er-mt/das-web-react
      secondary-repository: europe-west3-docker.pkg.dev/serca-artifact-registry/earthranger/das-web-react
      dockerfile: Dockerfile.mt
      build-args: ${{ needs.config.outputs.build-args }}
      deploy-enabled: false  # ArgoCD not ready yet

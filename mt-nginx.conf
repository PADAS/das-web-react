server {
	listen 80;
	listen [::]:80;
	root /usr/share/nginx/html;
	server_name  $hostname localhost;

	location /static {
		if ($request_method = 'OPTIONS') {
			add_header 'Access-Control-Allow-Origin' '*';
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			#
			# Custom headers and headers various browsers *should* be OK with but aren't
			#
			add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
			#
			# Tell client that this pre-flight info is valid for 20 days
			#
			add_header 'Access-Control-Max-Age' 1728000;
			add_header 'Content-Type' 'text/plain; charset=utf-8';
			add_header 'Content-Length' 0;
			return 204;
		}
		try_files $uri =404;
	}

	# Serves config.js if present on disk, otherwise returns an empty 200.
	# The app is expected to gracefully handle an empty response.
	location = /config.js {
		try_files /config.js @empty_config;
	}

	location @empty_config {
		default_type application/javascript;
		return 200 '';
	}

	location ~ ^/(login|reports|events|gear|patrols|layers|atlas|settings|eula|community)(?:/(.*))?$ {
		alias /usr/share/nginx/html;
		try_files /index.html =404;
	}

	# Tabs on a previous release request chunks this image no longer has; the
	# er-web-assets bucket keeps every release's assets for 30 days.
	location /assets/ {
		# No "always": a 404 or 5xx must never be cached as immutable.
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri @assets_bucket;
	}

	location @assets_bucket {
		# A variable-free proxy_pass resolves the host once at startup and
		# re-escapes the rewritten URI.
		rewrite ^ /er-web-assets$uri break;
		proxy_pass https://storage.googleapis.com;
		proxy_ssl_server_name on;
		proxy_ssl_name storage.googleapis.com;
		proxy_ssl_verify on;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_http_version 1.1;
		proxy_connect_timeout 3s;
		proxy_read_timeout 10s;

		# Never forward the user's session to Google.
		proxy_set_header Cookie "";
		proxy_set_header Authorization "";

		proxy_hide_header x-goog-generation;
		proxy_hide_header x-goog-metageneration;
		proxy_hide_header x-goog-stored-content-encoding;
		proxy_hide_header x-goog-stored-content-length;
		proxy_hide_header x-goog-hash;
		proxy_hide_header x-goog-storage-class;
		proxy_hide_header x-guploader-uploadid;
		proxy_hide_header Alt-Svc;
		proxy_hide_header Expires;
		proxy_hide_header Cache-Control;
		proxy_hide_header Set-Cookie;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		index index.html index.htm;
	}
}

server {
	listen 80;
	listen [::]:80;
	root /usr/share/nginx/html;
	server_name  $hostname localhost;

	location /static {
		if ($request_method = 'OPTIONS') {
			add_header 'Access-Control-Allow-Origin' '*';
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			#
			# Custom headers and headers various browsers *should* be OK with but aren't
			#
			add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
			#
			# Tell client that this pre-flight info is valid for 20 days
			#
			add_header 'Access-Control-Max-Age' 1728000;
			add_header 'Content-Type' 'text/plain; charset=utf-8';
			add_header 'Content-Length' 0;
			return 204;
		}
		try_files $uri =404;
	}

	# Serves config.js if present on disk, otherwise returns an empty 200.
	# The app is expected to gracefully handle an empty response.
	location = /config.js {
		try_files /config.js @empty_config;
	}

	location @empty_config {
		default_type application/javascript;
		return 200 '';
	}

	location ~ ^/(login|reports|events|gear|patrols|layers|settings|eula)(?:/(.*))?$ {
		alias /usr/share/nginx/html;
		try_files /index.html =404;
	}

	location / {
		index index.html index.htm;
	}
}


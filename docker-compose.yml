services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_VERSION: ${NODE_VERSION:?NODE_VERSION must be set (e.g. export NODE_VERSION=$(cat .node-version))}
    volumes:
      - .:/app
    restart: on-failure
